# Render Blueprint — Next.js web service backed by an external Supabase Postgres.
# Deploy by pushing this repo to GitHub, then: Render Dashboard → New → Blueprint.
#
# Notes:
# - The database lives on Supabase (free tier persists data; no 30-day deletion).
#   Set DATABASE_URL in the Render dashboard to your Supabase *Session pooler*
#   connection string (IPv4-compatible — Render can't reach Supabase's IPv6-only
#   direct host). SSL is auto-enabled for supabase hosts.
# - Free tier does NOT support preDeployCommand, so migrations + the idempotent
#   seed run at the start of startCommand instead (safe to repeat on each boot).
services:
  - type: web
    name: prode
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Supabase Session pooler connection string
      - key: ADMIN_NAMES
        sync: false # set your admin display name(s) in the dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false # set to your https://<service>.onrender.com URL after first deploy
      - key: NODE_VERSION
        value: "22.11.0"
      # Ensure devDependencies (tsx, drizzle-kit) are installed so build +
      # migrate + seed scripts can run on Render.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
