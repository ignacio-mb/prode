# Local development stack: Postgres + the Next.js app.
#
#   docker compose up -d db        # just the database (run the app with `npm run dev`)
#   docker compose up --build      # full stack in containers
#
# After the db is up:  npm run db:migrate && npm run db:seed
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prode
      POSTGRES_PASSWORD: prode
      POSTGRES_DB: prode
    ports:
      - "5432:5432"
    volumes:
      - prode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prode -d prode"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://prode:prode@db:5432/prode
      ADMIN_NAMES: ${ADMIN_NAMES:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret-change-me}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    # The app image runs migrations + (idempotent) seed on boot, then serves.
    command: sh -c "npm run db:migrate && npm run db:seed && npm run start"

volumes:
  prode_pgdata:
